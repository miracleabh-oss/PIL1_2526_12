<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <h1>Inscription</h1>

        <label>Nom</label>
        <input type="text" placeholder="Entrer votre nom">

        <br>
        <label>Prénom</label>
        <input type="text" placeholder="Entrer votre prénom">

        <br>
        <label>Email</label>
        <input type="email" placeholder="Entrer votre email">

        <br>
        <label>Numero de téléphone</label>
        <input type="tel" placeholder="Entrer votre numéro de téléphone">

        <br>
        <label>Filière</label>
        <select>
            <option value="">Choisir une filière</option>
            <option value="IA">IA</option>
            <option value="IM">IM</option>
            <option value="GL">GL</option>
            <option value="SI">SI</option>
            <option value="SE">SE & IoT</option>
        </select>
        <br>

         <label>Niveau</label>
        <select>
            <option value="">Choisir un niveau</option>
            <option value="L1">L1</option>
            <option value="L2">L2</option>
            <option value="L3">L3</option>
        </select>
        <br>

        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="Entrez votre mot de passe" required>
        <br>
        
        <label>Confirmer le mot de passe</label>
        <input type="password" id="password2" placeholder="Confirmer votre mot de passe" required>
        <br>

        <button type="button" id="btn-inscription">S'inscrire</button>
    
        <p>Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
    </form>
    <script src="inscription.js"></script>
</body>
</html>
