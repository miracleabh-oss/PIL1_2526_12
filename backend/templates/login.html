<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MentorLink - Connexion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Mentor<span>Link</span></h1>
            <p>Connectez-vous à votre compte</p>
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Email ou Téléphone</label>
                <input type="text" name="identifiant" 
                placeholder="Entrez votre email ou téléphone" required>
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="mot_de_passe" 
                placeholder="Entrez votre mot de passe" required>
            </div>

            <button type="submit" class="btn">Se connecter</button>
        </form>

        <div class="links">
            <p>Pas encore de compte ? <a href="/inscription">S'inscrire</a></p>
            <p style="margin-top:8px"><a href="/reset">Mot de passe oublié ?</a></p>
        </div>
    </div>
</body>
</html>
