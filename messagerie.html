<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie - Menthorlink</title>
    <link rel="stylesheet" href="messagerie.css">
</head>
<body>
    <div class="container">


        <div class="contacts">
            <h2>Conversations</h2>
            <div class="contact">Alex</div>
            <div class="contact">Ghislaine</div>
            <div class="contact">Amos</div>
        </div>

        <div class="chat">
          <h2>Messages</h2>
     
          <div class="zone-messages" id="zone-messages">

         
          </div>
 
         <div class="zone-ecriture">
           <input type="text" id="input-message" placeholder="Écrire un message...">
           <button id="btn-envoyer">Envoyer</button>
         </div>
        </div>
    </div>

    <script src="messagerie.js"></script>

</body>
</html>
