<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — MentorLink</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-layout">
    <div class="auth-card">
        <div class="auth-logo">
            <span></span>
            <h1>MentorLink</h1>
            <p class="auth-subtitle">Plateforme de mentorat IFRI</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.connexion') }}">
            <div class="form-group">
                <label>Email ou Téléphone</label>
                <input type="text" name="identifiant" placeholder="Entrez votre email ou numéro" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" placeholder="Entrez votre mot de passe" required>
            </div>
            <button type="submit" class="btn-primary btn-full">Se connecter</button>
        </form>

        <p class="auth-link"><a href="{{ url_for('auth.mot_de_passe_oublie') }}">Mot de passe oublié ?</a></p>
        <p class="auth-link">Pas encore de compte ? <a href="{{ url_for('auth.inscription') }}">S'inscrire</a></p>
    </div>
</body>
</html>
