<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation — MentorLink</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-layout">
    <div class="auth-card">
        <div class="auth-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1a3c34" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <h1>Nouveau mot de passe</h1>
            <p class="auth-subtitle">Entrez le code reçu et choisissez un nouveau mot de passe</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="email" value="{{ email }}">
            <div class="form-group">
                <label>Code de vérification (6 chiffres)</label>
                <input type="text" name="code" placeholder="123456" maxlength="6"
                       style="letter-spacing: 6px; font-size: 1.3rem; text-align: center;" required>
            </div>
            <div class="form-group">
                <label>Nouveau mot de passe</label>
                <input type="password" name="password" placeholder="Min. 6 caractères" required>
            </div>
            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <input type="password" name="password2" placeholder="Répétez le mot de passe" required>
            </div>
            <button type="submit" class="btn-primary btn-full">Réinitialiser</button>
        </form>

        <p class="auth-link">
            Pas reçu le code ?
            <a href="{{ url_for('auth.mot_de_passe_oublie') }}">Renvoyer</a>
        </p>
    </div>
</body>
</html>
