<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — MentorLink</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-layout">
    <div class="auth-card auth-card-wide">
        <div class="auth-logo">
            <span>🎓</span>
            <h1>MentorLink</h1>
            <p class="auth-subtitle">Créez votre compte</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.inscription') }}">
            <div class="form-row">
                <div class="form-group">
                    <label>Nom</label>
                    <input type="text" name="nom" placeholder="Votre nom" required>
                </div>
                <div class="form-group">
                    <label>Prénom</label>
                    <input type="text" name="prenom" placeholder="Votre prénom" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="votre@email.com" required>
                </div>
                <div class="form-group">
                    <label>Numéro de téléphone</label>
                    <input type="tel" name="telephone" placeholder="+229..." required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Filière</label>
                    <select name="filiere" required>
                        <option value="">Choisir une filière</option>
                        <option value="IA">IA</option>
                        <option value="IM">IM</option>
                        <option value="GL">GL</option>
                        <option value="SI">SI</option>
                        <option value="SE_IoT">SE & IoT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Niveau</label>
                    <select name="niveau" required>
                        <option value="">Choisir un niveau</option>
                        <option value="1">Licence 1</option>
                        <option value="2">Licence 2</option>
                        <option value="3">Licence 3</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" name="password" placeholder="Min. 6 caractères" required>
                </div>
                <div class="form-group">
                    <label>Confirmer le mot de passe</label>
                    <input type="password" name="password2" placeholder="Répétez le mot de passe" required>
                </div>
            </div>
            <button type="submit" class="btn-primary btn-full">Créer mon compte</button>
        </form>

        <p class="auth-link">Déjà un compte ? <a href="{{ url_for('auth.connexion') }}">Se connecter</a></p>
    </div>
</body>
</html>
