<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <form action="/inscription" method="POST">
        <h1>Inscription</h1>

        <label>Nom</label>
        <input type="text" name="nom" placeholder="Entrer votre nom">

        <br>
        <label>Prénom</label>
        <input type="text" name="prenom" placeholder="Entrer votre prénom">

        <br>
        <label>Email</label>
        <input type="email" name="email" placeholder="Entrer votre email">

        <br>
        <label>Numero de téléphone</label>
        <input type="tel" name="telephone" placeholder="Entrer votre numéro de téléphone">

        <br>
        <label>Filière</label>
        <select name="filiere">
            <option value="">Choisir une filière</option>
            <option value="IA">IA</option>
            <option value="IM">IM</option>
            <option value="GL">GL</option>
            <option value="SI">SI</option>
            <option value="SE">SE & IoT</option>
        </select>
        <br>

         <label>Niveau</label>
        <select name="niveau">
            <option value="">Choisir un niveau</option>
            <option value="L1">L1</option>
            <option value="L2">L2</option>
            <option value="L3">L3</option>
        </select>
        <br>

        <label>Mot de passe</label>
        <input type="password" name="password" id="password" placeholder="Entrez votre mot de passe" required>
        <br>
        
        <label>Confirmer le mot de passe</label>
        <input type="password" name="password2" id="password2" placeholder="Confirmer votre mot de passe" required>
        <br>

        <button type="submit" id="btn-inscription">S'inscrire</button>
    
        <p>Déjà un compte ? <a href="/connexion">Se connecter</a></p>
    </form>
    <script src="{{ url_for('static', filename='inscription.js') }}"></script>
</body>
</html>
